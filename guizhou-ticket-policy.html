            font-weight: 700;

        .source-link {

        .tag-mini {

            border-radius: 3px;

            font-weight: 600;
        }
        .tag-wxmp {
            display: inline-block;
            background: #07c160;
            color: white;
            font-size: 10.5px;
            padding: 1px 5px;
            border-radius: 3px;
            vertical-align: middle;
            margin-left: 4px;
            font-weight: 600;
            background: #1890ff;
        }
        .source-web { font-size: 11.5px; color: #999; margin-top: 4px; }
        .source-update {

        }
        .note {

        .official-doc-label {

        .footer {

        .footer a { color: #1a6b3c; text-decoration: none; }

        .sources-summary {
            max-width: 720px;
            margin: 0 auto 40px;
            padding: 0 16px;
        }
        .sources-summary h2 {
            font-size: 17px;

        .sources-summary h2 .toggle-arrow {

            margin-left: 6px;
        }

        .stat-card {

            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .stat-card .stat-num {

            color: #1a6b3c;

        }

            border-radius: 10px;
        }
        .src-card-level.lv-5a { background: #fdecea; color: #e74c3c; }
        .src-card-level.lv-4a { background: #fef5e7; color: #f39c12; }
        .src-card-level.lv-free { background: #eafaf1; color: #27ae60; }
        .src-card-channels {
            display: flex;

<body>

<div class="header">
    <h1>🏔️ 贵州景区门票优惠政策查询</h1>
    <p>更新于2026年8月20日17时</p>
    <p>数据来源：景区官网 · 微信小程序/公众号 · 贵州省政府门户</p>
</div>

<div class="tab-nav">
    <button class="tab-btn active" onclick="showTab(1, this)">🎫 门票优惠政策</button>
    <button class="tab-btn" onclick="showTab(2, this)">🎟️ 售罄统计</button>
    <button class="tab-btn" onclick="showTab(3, this)">🚧 关闭/暂停</button>
</div>

<div id="tab1">
<div class="search-bar">
    <div class="search-inner">
        <input type="text" id="searchInput" placeholder="搜索景区名称，如：黄果树、梵净山、西江..." oninput="filterCards()">
        <button onclick="filterCards()">搜索</button>
    </div>
</div>

<div class="filter-bar">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">全部</button>
    <button class="filter-btn" data-filter="5A" onclick="setFilter('5A', this)">5A景区</button>
    <button class="filter-btn" data-filter="free" onclick="setFilter('free', this)">有免票政策</button>
    <button class="filter-btn" data-filter="student" onclick="setFilter('student', this)">学生优惠</button>
    <button class="filter-btn" data-filter="police" onclick="setFilter('police', this)">👮 人民警察</button>

function renderCards(data) {
    const container = document.getElementById("cardList");

    const count = document.getElementById("resultCount");

    if (data.length === 0) {
        container.innerHTML = "";
        empty.style.display = "block";
        count.textContent = "共找到 0 个景区";
        return;

    empty.style.display = "none";

function formatSoldOutDays(days) {
    var seen = {};
    var parsed = [];
    days.forEach(function(d) {
        var p = d.split("/");
        var m = +p[0], dd = +p[1];
        var key = m + "-" + dd;
        if (!seen[key]) { seen[key] = 1; parsed.push({ m: m, d: dd }); }
    });
    parsed.sort(function(a, b) { return a.m - b.m || a.d - b.d; });
    var byMonth = {};
    parsed.forEach(function(p) { (byMonth[p.m] = byMonth[p.m] || []).push(p.d); });
    var parts = [];
    Object.keys(byMonth).map(Number).sort(function(a, b) { return a - b; }).forEach(function(m) {
        var list = byMonth[m];
        var segs = [];
        var start = list[0], prev = list[0];
        for (var i = 1; i < list.length; i++) {
            if (list[i] === prev + 1) { prev = list[i]; }
            else { segs.push([start, prev]); start = list[i]; prev = list[i]; }
        }
        segs.push([start, prev]);
        var chips = segs.map(function(seg) {
            if (seg[0] === seg[1]) return '<span class="so-chip">' + m + '/' + seg[0] + '</span>';
            return '<span class="so-chip">' + m + '/' + seg[0] + '–' + m + '/' + seg[1] + '</span> <span class="so-days">' + (seg[1] - seg[0] + 1) + '天</span>';
        });
        parts.push('<div class="so-month-group"><span class="so-month">' + m + '月</span> ' + chips.join(' ') + '</div>');
    });
    return parts.join('');
}

function renderSourceTable() {
    const total = scenicData.length;
    const hasMini = scenicData.filter(s => s.wechatMini).length;
    const hasOfficial = scenicData.filter(s => s.wechatOfficial).length;
    const hasWeb = scenicData.filter(s => s.sourceUrl).length;

    // 统计卡片
    const statsHTML = [
        { num: total, label: "覆盖景区", pct: 100 },
        { num: hasMini, label: "微信小程序", pct: Math.round(hasMini / total * 100) },
        { num: hasOfficial, label: "微信公众号", pct: Math.round(hasOfficial / total * 100) },
        { num: hasWeb, label: "网页来源", pct: Math.round(hasWeb / total * 100) }
    ].map(s => `
        <div class="stat-card">
            <div class="stat-num">${s.num}</div>
            <div class="stat-label">${s.label}</div>
            <div class="stat-bar"><div class="stat-bar-fill" style="width:${s.pct}%"></div></div>
        </div>
    `).join("");
    document.getElementById("sourceStats").innerHTML = statsHTML;

    // 景区卡片列表
    const cardsHTML = scenicData.map(s => {
        const lvClass = s.level === "5A" ? "lv-5a" : s.level === "4A" ? "lv-4a" : "lv-free";
        const lvText = s.level === "免费" ? "免费" : s.level;

        return `
        <div class="src-card">
            <div class="src-card-header">
                <span class="src-card-name">${s.name}</span>
                <span class="src-card-level ${lvClass}">${lvText}</span>
            </div>
            <div class="src-card-channels">
                <div class="src-ch-row">
                    <div class="src-ch-icon ic-mini">📱</div>
                    <div class="src-ch-body">
                        <div class="src-ch-value">${s.wechatMini || "—"}<span class="src-ch-tag tag-g">小程序</span></div>
                    </div>
                </div>
                <div class="src-ch-row">
                    <div class="src-ch-icon ic-official">💬</div>
                    <div class="src-ch-body">
                        <div class="src-ch-value">${s.wechatOfficial || "—"}<span class="src-ch-tag tag-b">公众号</span></div>
                    </div>
                </div>
                <div class="src-ch-row">
                    <div class="src-ch-icon ic-web">🔗</div>
                    <div class="src-ch-body">
                        <a class="src-ch-link" href="${s.sourceUrl}" target="_blank" rel="noopener">${s.source} ↗</a>
                    </div>
                </div>
            </div>
        </div>`;
    }).join("");
    document.getElementById("sourceCards").innerHTML = cardsHTML;
}

// 提取 title 中含关键词的片段，按分号拆分后拼接
function extractAlertFrag(title, keywords) {
    const frags = [];
    title.split(/[；;]/).forEach(p => {
        if (keywords.some(k => p.includes(k))) {
            const cleaned = p.replace(/[🎉🆕⚠️✅🔔]/g, "").replace(/^[\s:：·]+|[\s:：·]+$/g, "").trim();
            if (cleaned) frags.push(cleaned);
        }
    });
    return frags.join("；");
}

// 从 scenicData 自动汇总「关闭/暂停」统计
function renderClosedPanel() {
    const closedKeywords = ["关闭", "暂停", "停运", "停漂", "停业"];
    const rows = [];
    scenicData.forEach(s => {
        const a = s.announcement;
        if (!a) return;
        const title = a.title || "";
        const frag = extractAlertFrag(title, closedKeywords);
        if (frag) {
            rows.push('<tr><td><b>' + s.name + '</b></td><td>' + frag + '</td></tr>');
        }
    });
    const html = '<div class="panel-header">🚧 景区关闭 / 暂停统计</div>' +
        '<div class="panel-sub">数据截至8月22日 · 来源：各景区官方公告</div>' +
        '<table class="soldout-table"><thead><tr><th>景区</th><th>关闭 / 暂停项目</th></tr></thead><tbody>' + rows.join('') + '</tbody></table>' +
        '<div class="panel-section"><h4>📊 说明</h4><ul>' +
        '<li>以上为截至更新当日仍在关闭或暂停的景区设施、景点或项目。</li>' +
        '<li>「关闭」多为景点、步道、索道等长期或临时关闭；「暂停」多为演出、游船、漂流等临时停运。</li>' +
        '<li>部分项目恢复时间未定，出行前建议电话确认最新状态。</li>' +
        '</ul></div>';
    document.getElementById("closedPanelContent").innerHTML = html;
}

function showTab(tab, btn) {
    document.getElementById("tab1").style.display = (tab === 1) ? "block" : "none";
    document.getElementById("tab2").style.display = (tab === 2) ? "block" : "none";
    document.getElementById("tab3").style.display = (tab === 3) ? "block" : "none";
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}

function toggleSources(header) {
    const body = document.getElementById("sourcesBody");
    const arrow = header.querySelector(".toggle-arrow");
    if (body.style.display === "none") {
        body.style.display = "block";
        if (arrow) arrow.textContent = "▲";
    } else {
        body.style.display = "none";
        if (arrow) arrow.textContent = "▼";
    }
}

// Init
renderClosedPanel();
renderSoldoutPanel();
renderCards(scenicData);
renderSourceTable();
