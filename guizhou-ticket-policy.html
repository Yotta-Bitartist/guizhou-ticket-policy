function renderCards(data) {
    const container = document.getElementById("cardList");
    const empty = document.getElementById("emptyState");
    const count = document.getElementById("resultCount");

    if (data.length === 0) {
        container.innerHTML = "";
        empty.style.display = "block";
        count.textContent = "共找到 0 个景区";
        return;
    }
    empty.style.display = "none";
    count.textContent = "共找到 " + data.length + " 个景区";

    container.innerHTML = data.map((s, i) => {
        const levelClass = s.level === "5A" ? "r5a" : s.level === "4A" ? "r4a" : "r-free";
        const badgeClass = s.level === "5A" ? "badge-5a" : s.level === "4A" ? "badge-4a" : "badge-free";
        const levelText = s.level === "免费" ? "免费开放" : s.level;

        let priceRows = "";
        if (s.price.ticket) priceRows += `<tr><td>大门票</td><td class="price-highlight">${s.price.ticket}</td></tr>`;
        if (s.price.bus) priceRows += `<tr><td>观光车</td><td>${s.price.bus}</td></tr>`;
        if (s.price.shuttle) priceRows += `<tr><td>摆渡车</td><td class="price-highlight">${s.price.shuttle}</td></tr>`;
        if (s.price.cable) priceRows += `<tr><td>索道</td><td>${s.price.cable}</td></tr>`;
        if (s.price.escalator) priceRows += `<tr><td>扶梯</td><td>${s.price.escalator}</td></tr>`;
        if (s.price.insurance) priceRows += `<tr><td>保险</td><td>${s.price.insurance}</td></tr>`;
        if (s.price.experience) priceRows += `<tr><td>天文体验馆</td><td>${s.price.experience}</td></tr>`;
        if (s.price.balcony) priceRows += `<tr><td>观景台</td><td>${s.price.balcony}</td></tr>`;
        if (s.price.spots) priceRows += `<tr><td>各景点票价</td><td>${s.price.spots}</td></tr>`;

        const freeList = s.free.map(f => `<li>${f}</li>`).join("");

        return `
        <div class="card" data-id="${s.id}">
            <div class="card-header" onclick="toggleCard(this)">
                <div class="card-header-left">
                    <div class="card-rank ${levelClass}">${i + 1}</div>
                    <a class="btn-official" href="${s.officialUrl || '#'}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="访问${s.name}官方网站">🌐 官网</a>
                    <span class="card-title">${s.name}</span>
                    <span class="card-badge ${badgeClass}">${levelText}</span>
                </div>
                <div class="card-arrow">▼</div>
            </div>
            <div class="card-body">
                <div class="card-body-inner">
                    ${s.announcement ? `<div class="announcement-bar${s.announcement.type === 'warning' ? ' ann-warning' : ''}"><div class="ann-title">${s.announcement.type === 'danger' ? '🚨' : '⚠️'} ${s.announcement.title}<span class="ann-time">${s.announcement.time}</span></div>${s.announcement.text}${s.announcement.officialDoc ? `<div class="official-doc" onclick="event.stopPropagation()"><div class="official-doc-label">📄 官方红头文件（点击放大查看）</div><img src="${s.announcement.officialDoc}" alt="${s.name}官方通告文件" onclick="window.open(this.src,'_blank')"></div>` : ''}${s.announcement.officialDocUrl ? `<div style="margin-top:8px"><a href="${s.announcement.officialDocUrl}" target="_blank" rel="noopener" style="color:#1a6b3c;font-size:12px;text-decoration:none;border:1px solid #1a6b3c;border-radius:6px;padding:3px 10px;display:inline-block">📄 查看官方通告原文 ↗</a></div>` : ''}</div>` : '<div class="no-announcement">✅ 当前无特殊公告，正常开放</div>'}

                    <div class="section-title">💰 门票价格</div>
                    <table class="price-table">
                        <thead><tr><th>项目</th><th>价格</th></tr></thead>
                        <tbody>${priceRows}</tbody>
                    </table>

                    <div class="section-title">🆓 免票 / 优惠政策</div>
                    <ul class="policy-list">${freeList}</ul>

                    ${s.note ? `<div class="note">⚠️ ${s.note}</div>` : ""}

                    <div class="source-section">
                        <div class="source-row">
                            <span class="source-label">📱 微信小程序</span>
                            <span class="source-value">${s.wechatMini || "—"}<span class="tag-mini">小程序</span></span>
                        </div>
                        <div class="source-row">
                            <span class="source-label">💬 微信公众号</span>
                            <span class="source-value">${s.wechatOfficial || "—"}<span class="tag-wxmp">公众号</span></span>
                        </div>
                        <div class="source-web">
                            📎 网页数据来源：
                            <a href="${s.sourceUrl}" target="_blank" rel="noopener">${s.source}</a> ↗
                        </div>
                        <div class="source-update">
                            <span class="update-label">🕐 政策数据最新发布时间</span>
                            <span class="update-time">${s.publishDate || "未知"}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
    }).join("");
}

function toggleCard(header) {
    const card = header.parentElement;
    card.classList.toggle("open");
}

function filterCards() {
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    let filtered = scenicData;

    if (keyword) {
        filtered = filtered.filter(s => s.name.toLowerCase().includes(keyword));
    }
    if (currentFilter === "5A") {
        filtered = filtered.filter(s => s.level === "5A");
    } else if (currentFilter === "free") {
        filtered = filtered.filter(s => s.tags.includes("免票"));
    } else if (currentFilter === "student") {
        filtered = filtered.filter(s => s.tags.includes("学生"));
    } else if (["police","military","veteran","teacher","medical"].includes(currentFilter)) {
        const kwMap = { police: "警察", military: "现役军人", veteran: "退役军人", teacher: "教师", medical: "医护" };
        const keyword = kwMap[currentFilter];
        filtered = filtered.filter(s => s.free && s.free.some(item => item.includes(keyword)));
    }

    renderCards(filtered);
}

function setFilter(type, btn) {
    currentFilter = type;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    filterCards();
}

                        <div class="src-ch-value">${s.wechatOfficial || "—"}<span class="src-ch-tag tag-b">公众号</span></div>
                    </div>
                </div>
                <div class="src-ch-row">
                    <div class="src-ch-icon ic-web">🔗</div>
                    <div class="src-ch-body">
                        <a class="src-ch-link" href="${s.sourceUrl}" target="_blank" rel="noopener">${s.source} ↗</a>
                    </div>
                </div>
            </div>
        </div>`;
    }).join("");
    document.getElementById("sourceCards").innerHTML = cardsHTML;
}

// Init
renderCards(scenicData);
renderSourceTable();
</script>
</body>
